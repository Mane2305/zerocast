[project]
name = "zerocast-backend"
version = "0.1.0"
description = "ZeroCast API: honest zero-shot forecasting backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-multipart>=0.0.32",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
